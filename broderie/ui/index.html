<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broderie</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
<header>
  <div class="titre"><img class="logo" src="logo.png" alt=""><span class="nom-appli">Broderie</span></div>
  <nav class="onglets" id="vues">
    <button data-vue="objets" class="on" title="Objets : choisir et régler"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19M12 3v18M3 12h18"/></svg><span>Objets</span></button>
    <button data-vue="points" title="Points : simulation de la broderie"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Points</span></button>
    <button data-vue="apercu" title="Aperçu : rendu, densité, statistiques"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>Aperçu</span></button>
    <button data-vue="export" title="Export : cadre et fichier machine"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 20h14"/></svg><span>Export</span></button>
  </nav>
  <button id="bLarge" class="ico-entete" title="Aperçu à gauche des réglages (élargit la fenêtre) / panneau étroit"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 5v14"/></svg></button>
</header>
<div id="bandeauAncien" hidden></div>
<main>
  <!-- Objets : liste + réglages de l'objet choisi -->
  <section id="v-objets" class="vue">
    <div id="emplApercuObjets" class="empl-apercu"><div id="poignee" title="Glisser pour agrandir ou réduire l'aperçu"></div></div>
    <div class="defile">
    <div class="carte">
      <div class="carte-titre"><span>Calques et objets</span><button id="bTexte" class="petit" title="Ajouter un texte brodé">＋ Texte</button></div>
      <ul id="liste"></ul>
      <div id="aideSelection" class="muted small"></div>
    </div>
    <div id="props" class="carte"></div>
    <div id="texte" class="carte" hidden></div>
    </div>
  </section>
  <!-- Points : simulation de la broderie -->
  <section id="v-points" class="vue" hidden>
    <div id="simu">
      <div class="simu-vue">
        <canvas id="simuCanvas"></canvas>
        <div id="simuCmd" class="simu-cmd"></div>
        <div id="simuInfo" class="simu-info" hidden></div>
        <div id="simuReglages" class="simu-info" hidden></div>
      </div>
      <div id="poigneeSimu" title="Glisser pour agrandir ou réduire la simulation (double-clic : toute la hauteur)"></div>
      <div class="simu-piste"><canvas id="sMarques"></canvas><input id="sPos" type="range" min="0" max="0" value="0"></div>
      <div class="simu-barre controles" id="simuControles"></div>
      <div class="simu-barre vues" id="simuVues"></div>
      <div class="simu-barre"><span id="sInfo" class="muted small"></span></div>
    </div>
  </section>
  <!-- Aperçu : rendu des points, légende et statistiques -->
  <section id="v-apercu" class="vue" hidden>
    <div id="emplApercu" class="empl-apercu grand"><div id="apercu" class="vide">L'aperçu des points s'affiche ici.</div></div>
    <div class="carte" id="stats"></div>
  </section>
  <!-- Export -->
  <section id="v-export" class="vue" hidden>
    <div class="carte">
      <div class="carte-titre"><span>Exporter</span></div>
      <label class="etiquette">Fichier de broderie</label>
      <select id="fFormat"></select>
      <label class="etiquette">Cadre de la brodeuse</label>
      <div class="ligne-cadre"><select id="fCadre"></select><button id="bCadreSuppr" class="petit" title="Supprimer ce cadre de la liste">Supprimer</button></div>
      <div id="cadreInfo" class="small"></div>
      <details id="nouveauCadre" class="theme"><summary>Ajouter un cadre</summary>
        <div class="champ"><label>Nom</label><input type="text" id="ncNom" placeholder="ex. Grand cadre Brother"></div>
        <div class="champ"><label>Largeur (mm)</label><input type="number" id="ncL" min="10" step="1"></div>
        <div class="champ"><label>Hauteur (mm)</label><input type="number" id="ncH" min="10" step="1"></div>
        <button id="bCadreAjout" class="petit">Ajouter ce cadre</button>
      </details>
      <div class="boutons-cadre">
        <button id="bCadreCentrer" title="Centre le motif dans le cadre et fait de la page d'Inkscape la taille du cadre">⊕ Centrer le motif dans le cadre</button>
        <label class="interrupteur"><span>Montrer le cadre dans Inkscape (la page prend sa taille)</span><input type="checkbox" id="cbCadrePage" checked></label>
      </div>
      <button id="bExport" class="principal large">Exporter</button>
      <p class="muted small">Le fichier est calculé par Ink/Stitch et enregistré dans Téléchargements.</p>
    </div>
    <div class="carte" id="bobines"></div>
    <div class="carte" id="statsExport"></div>
    <div class="carte">
      <div class="carte-titre"><span>Outils avancés</span></div>
      <button id="bFichePdf" title="Fiche à imprimer pour la brodeuse : aperçu, couleurs, ordre des fils (fenêtre d'Ink/Stitch)">Fiche PDF pour la machine…</button>
      <button id="bPlus">Toutes les commandes Ink/Stitch…</button>
    </div>
  </section>
</main>
<div id="tache" hidden></div>
<div id="journal" class="muted small"></div>
<footer>
  <span id="attenteInfo"></span>
  <button id="bAbandonner" hidden title="Oublier les modifications pas encore envoyées à Inkscape">Annuler</button>
  <button id="bEnvoyer" class="synchro ok" title="Comme ⌘⌥B dans Inkscape : envoie les réglages au dessin et reçoit les nouvelles formes">⇄ Synchroniser</button>
</footer>
<dialog id="dlgCmd">
  <form method="dialog" class="dlg">
    <div class="dlg-titre"><h2>Toutes les commandes Ink/Stitch</h2><button value="fermer">Fermer</button></div>
    <input id="cmdRecherche" type="search" placeholder="Rechercher une commande…">
    <div class="dlg-corps">
      <ul id="cmdListe"></ul>
      <div id="cmdForm"><p class="muted">Choisissez une commande.</p></div>
    </div>
  </form>
</dialog>
<div id="attente" hidden><div><span id="attenteMsg">Ink/Stitch travaille…</span></div></div>
<script src="app.js"></script>
</body>
</html>
